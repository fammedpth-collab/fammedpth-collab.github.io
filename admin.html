<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — ระบบประเมินกิจกรรม รพ.ปทุมธานี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F5F4;--surface:#FFFFFF;--surface-2:#F7FAF8;--ink:#16261F;--ink-soft:#5B6F68;--ink-faint:#93A39D;
    --primary:#13876E;--primary-deep:#0C5E4D;--primary-soft:#DCEEE8;--line:#E1E9E5;
    --warn:#C2542F;--warn-soft:#FCE5DC;--good:#1E9E7E;
    --shadow:0 1px 2px rgba(16,38,31,.05),0 4px 16px rgba(16,38,31,.06);
    --radius:12px;--sidebar-w:220px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Sans Thai',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:'IBM Plex Mono',monospace;font-feature-settings:"tnum"}
  button,input,select,textarea{font-family:inherit;font-size:14px}
  input,select,textarea{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--primary)}
  button{cursor:pointer}

  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
  .gate-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:32px 28px}
  .gate-badge{width:48px;height:48px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;margin-bottom:16px}
  .gate-card h1{font-size:19px;font-weight:600;margin-bottom:6px}
  .gate-card p{font-size:13px;color:var(--ink-soft);margin-bottom:20px}
  .gate-card input{width:100%;margin-bottom:12px}
  .gate-card button{width:100%;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:11px;font-weight:600}
  .gate-err{color:var(--warn);font-size:12.5px;margin-top:8px;min-height:16px}

  #app{display:none}
  .shell{display:flex;min-height:100vh}
  .sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:20px 0;position:fixed;top:0;bottom:0;overflow-y:auto}
  .brand{padding:0 20px 18px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .brand b{font-size:14.5px;display:block}
  .brand span{font-size:11.5px;color:var(--ink-faint)}
  .navitem{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13.5px;color:var(--ink-soft);cursor:pointer;border-left:3px solid transparent}
  .navitem:hover{background:var(--surface-2)}
  .navitem.on{color:var(--primary-deep);font-weight:600;border-left-color:var(--primary);background:var(--primary-soft)}
  .navitem .n{width:20px;text-align:center;font-size:12px;color:var(--ink-faint)}
  .navitem.on .n{color:var(--primary)}
  .main{margin-left:var(--sidebar-w);flex:1;padding:28px 36px;max-width:1100px}
  .pagehead{margin-bottom:22px}
  .pagehead h1{font-size:21px;font-weight:600}
  .pagehead p{font-size:13.5px;color:var(--ink-soft);margin-top:3px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
  .card h2{font-size:15px;font-weight:600;margin-bottom:14px}
  .row-flex{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em}
  .btn{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13.5px}
  .btn.ghost{background:var(--surface-2);color:var(--ink-soft)}
  .btn.danger{background:var(--warn-soft);color:var(--warn)}
  .btn.small{padding:5px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);padding:8px 10px;border-bottom:1.5px solid var(--line)}
  td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  td input,td select{width:100%;padding:6px 8px;font-size:13px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px}
  .pill.on{background:var(--primary-soft);color:var(--primary-deep)}
  .pill.off{background:#EDEEEE;color:var(--ink-faint)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--warn)}
  .mut{color:var(--ink-faint);font-size:12.5px}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:6px}
  .stat{background:var(--surface-2);border-radius:10px;padding:14px}
  .stat b{font-size:24px;display:block;font-family:'IBM Plex Mono'}
  .stat span{font-size:12px;color:var(--ink-soft)}
  .loading{text-align:center;color:var(--ink-faint);padding:30px;font-size:13.5px}
  .activity-block{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .activity-block .ahead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .activity-block .ahead b{font-size:14px}
  .crit-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .crit-row input{flex:1}
  .crit-row .idx{width:22px;text-align:center;color:var(--ink-faint);font-size:12px;flex-shrink:0}
  .track-block{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  .track-block .theadrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .milestone-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .milestone-row input{flex:1}
  .checkline{display:flex;align-items:center;gap:6px;font-size:13px}
  .checkline input{width:auto}
  #toast-box{position:fixed;inset:0;pointer-events:none;z-index:200}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#CBD8D3;border-radius:4px}
  @media (max-width:860px){
    .sidebar{position:static;width:100%;height:auto;border-right:none;border-bottom:1px solid var(--line)}
    .main{margin-left:0;padding:20px}
    .shell{flex-direction:column}
  }
</style>
</head>
<body>

  <div id="gate">
    <div class="gate-card">
      <div class="gate-badge">A</div>
      <h1>เข้าสู่ระบบ Admin</h1>
      <p>ใส่รหัสผ่านเพื่อจัดการระบบประเมินกิจกรรม</p>
      <input type="password" id="pw" placeholder="รหัสผ่าน" onkeydown="if(event.key==='Enter')doLogin()">
      <button onclick="doLogin()">เข้าสู่ระบบ</button>
      <div class="gate-err" id="gateErr"></div>
    </div>
  </div>

  <div id="app">
    <div class="shell">
      <div class="sidebar">
        <div class="brand"><b>Admin Console</b><span>ระบบประเมินกิจกรรม รพ.ปทุมธานี</span></div>
        <div class="navitem on" data-p="overview" onclick="go('overview')"><span class="n">◆</span> ภาพรวม</div>
        <div class="navitem" data-p="residents" onclick="go('residents')"><span class="n">1</span> แพทย์ประจำบ้าน</div>
        <div class="navitem" data-p="faculty" onclick="go('faculty')"><span class="n">2</span> อาจารย์</div>
        <div class="navitem" data-p="criteria" onclick="go('criteria')"><span class="n">3</span> เกณฑ์การประเมิน</div>
        <div class="navitem" data-p="activities" onclick="go('activities')"><span class="n">4</span> รายชื่อกิจกรรม</div>
        <div class="navitem" data-p="tracks" onclick="go('tracks')"><span class="n">5</span> Schedule รายสัปดาห์</div>
        <div class="navitem" data-p="progress" onclick="go('progress')"><span class="n">6</span> Progress Milestones</div>
        <div class="navitem" data-p="stats" onclick="go('stats')"><span class="n">7</span> สถิติ/ข้อมูลดิบ</div>
        <div class="navitem" data-p="danger" onclick="go('danger')"><span class="n">8</span> ล้างข้อมูลทดสอบ</div>
      </div>
      <div class="main" id="main"></div>
    </div>
  </div>

  <div id="toast-box"><div class="toast" id="toast"></div></div>

<script>
/* ===================== แก้ค่านี้ — ใช้ API เดียวกับ liff-index.html ===================== */
const API = 'https://script.google.com/macros/s/AKfycbwM5gNNA68y5b8Yx_E-uFFey9-YNkZ6zRxMTfQylxIJnKwihz-DADGkEWR-4mooTzBMgA/exec';
/* ======================================================================================= */

let PW='';
let DATA=null;

function toast(msg,isErr){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(isErr?' err':'');
  setTimeout(()=>t.classList.remove('show'),2600);
}

function apiGet(action,params){
  params=params||{};
  const qs=Object.keys(params).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
  return fetch(API+'?action='+action+(qs?'&'+qs:'')).then(r=>r.json());
}
function apiPost(body){
  return fetch(API,{method:'POST',body:JSON.stringify(body)}).then(r=>r.json());
}
function adminGet(action,extra){
  const p=Object.assign({password:PW},extra||{});
  return apiGet(action,p);
}
function adminPost(action,extra){
  const p=Object.assign({action:action,password:PW},extra||{});
  return apiPost(p);
}

function doLogin(){
  const pw=document.getElementById('pw').value;
  if(!pw){ document.getElementById('gateErr').textContent='ใส่รหัสผ่านก่อนนะ'; return; }
  PW=pw;
  document.getElementById('gateErr').textContent='กำลังตรวจสอบ…';
  adminGet('adminGetAll').then(d=>{
    if(d && d.ok===false){ document.getElementById('gateErr').textContent='รหัสผ่านไม่ถูกต้อง'; PW=''; return; }
    DATA=d;
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    go('overview');
  }).catch(()=>{ document.getElementById('gateErr').textContent='เชื่อมต่อไม่สำเร็จ ลองใหม่'; });
}

function refreshData(){ return adminGet('adminGetAll').then(d=>{ DATA=d; }); }

let CURRENT_PAGE='overview';
function go(page){
  CURRENT_PAGE=page;
  document.querySelectorAll('.navitem').forEach(el=>el.classList.toggle('on', el.dataset.p===page));
  const renderers={
    overview: renderOverview, residents: renderResidents, faculty: renderFaculty,
    criteria: renderCriteria, activities: renderActivities, tracks: renderSchedule,
    progress: renderTracks, stats: renderStats, danger: renderDanger
  };
  (renderers[page]||renderOverview)();
}

function renderOverview(){
  const s=DATA.stats||{};
  document.getElementById('main').innerHTML=`
    <div class="pagehead"><h1>ภาพรวมระบบ</h1><p>สรุปสถานะปัจจุบันของระบบประเมินกิจกรรม</p></div>
    <div class="stat-grid">
      <div class="stat"><b class="mono">${s.totalResidents||0}</b><span>แพทย์ประจำบ้านที่ใช้งาน</span></div>
      <div class="stat"><b class="mono">${(DATA.faculty||[]).filter(f=>f.active).length}</b><span>อาจารย์ที่มีสิทธิ์</span></div>
      <div class="stat"><b class="mono">${s.totalResponses||0}</b><span>การประเมินทั้งหมด</span></div>
      <div class="stat"><b class="mono">${s.totalMembers||0}</b><span>คนที่ลงทะเบียนในระบบ</span></div>
    </div>
    <div class="card">
      <h2>ทางลัด</h2>
      <div class="row-flex">
        <button class="btn ghost" onclick="go('residents')">+ เพิ่มแพทย์ประจำบ้าน</button>
        <button class="btn ghost" onclick="go('faculty')">+ เพิ่มอาจารย์</button>
        <button class="btn ghost" onclick="go('tracks')">+ กรอกตารางกิจกรรมสัปดาห์นี้</button>
      </div>
    </div>
    ${(s.neverEvaluated&&s.neverEvaluated.length)?`
    <div class="card">
      <h2>แพทย์ประจำบ้านที่ยังไม่เคยถูกประเมินเลย</h2>
      <p class="mut" style="margin-bottom:8px">${s.neverEvaluated.length} คน</p>
      <p>${s.neverEvaluated.join(', ')}</p>
    </div>`:''}
  `;
}

function renderResidents(){
  const list=DATA.residents||[];
  const currentYearBE = (()=>{ const d=new Date(); const by=d.getFullYear()+543; return d.getMonth()+1>=7?by:by-1; })();
  let rows=list.map(r=>{
    const yearsIn=currentYearBE - r.entryYear + 1;
    const label = yearsIn<1?'ยังไม่เข้าศึกษา': yearsIn>3?('ศิษย์เก่ารุ่น '+(r.entryYear-2566)) : ('R'+yearsIn);
    return `<tr data-row="${r.row}">
      <td><input value="${escAttr(r.name)}" class="f-name"></td>
      <td><input type="number" value="${r.entryYear}" class="f-entryyear" style="width:90px"></td>
      <td><span class="mut mono">${label}</span></td>
      <td><label class="checkline"><input type="checkbox" ${r.active?'checked':''} class="f-active"> ใช้งาน</label></td>
      <td>
        <button class="btn small" onclick="saveResidentRow(${r.row})">บันทึก</button>
        <button class="btn small danger" onclick="deleteResidentRow(${r.row},'${escJs(r.name)}')">ลบ</button>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('main').innerHTML=`
    <div class="pagehead"><h1>แพทย์ประจำบ้าน</h1><p>เพิ่ม/ลบ/แก้ชื่อและปีที่เข้าศึกษา — ชั้นปีคำนวณอัตโนมัติจาก entryYear (เลื่อนชั้นทุก 1 ก.ค.)</p></div>
    <div class="card">
      <h2>รายชื่อทั้งหมด (${list.length} คน)</h2>
      <table>
        <thead><tr><th style="width:32%">ชื่อ</th><th>Entry Year (พ.ศ.)</th><th>ชั้นปีปัจจุบัน</th><th>สถานะ</th><th></th></tr></thead>
        <tbody id="resTbody">${rows||'<tr><td colspan="5" class="mut">ยังไม่มีข้อมูล</td></tr>'}</tbody>
      </table>
    </div>
    <div class="card">
      <h2>เพิ่มแพทย์ประจำบ้านใหม่</h2>
      <div class="row-flex">
        <div class="field"><label>ชื่อ</label><input id="newResName" placeholder="เช่น นพ.สมชาย ใจดี" style="width:260px"></div>
        <div class="field"><label>Entry Year (พ.ศ.)</label><input id="newResYear" type="number" value="${currentYearBE}" style="width:110px"></div>
        <button class="btn" onclick="addResident()">+ เพิ่ม</button>
      </div>
      <p class="mut" style="margin-top:10px">เพิ่มรุ่นใหม่: ใส่ entryYear เป็นปีปัจจุบัน ระบบจะขึ้น R1 ให้เองอัตโนมัติ</p>
    </div>
  `;
}
function saveResidentRow(row){
  const tr=document.querySelector('#resTbody tr[data-row="'+row+'"]');
  const name=tr.querySelector('.f-name').value.trim();
  const entryYear=tr.querySelector('.f-entryyear').value;
  const active=tr.querySelector('.f-active').checked;
  if(!name||!entryYear){ toast('กรอกชื่อและปีให้ครบ',true); return; }
  adminPost('adminSaveResident',{row:row,name:name,entryYear:entryYear,active:active}).then(d=>{
    if(d.ok){ toast('บันทึกแล้ว ✓'); refreshData().then(renderResidents); } else toast(d.error||'บันทึกไม่สำเร็จ',true);
  });
}
function deleteResidentRow(row,name){
  if(!confirm('ลบ "'+name+'" ออกจากระบบ?\nข้อมูลการประเมินเก่าที่มีอยู่แล้วจะไม่หาย แต่จะเลือกชื่อนี้ในฟอร์มใหม่ไม่ได้อีก')) return;
  adminPost('adminDeleteResident',{row:row}).then(d=>{
    if(d.ok){ toast('ลบแล้ว ✓'); refreshData().then(renderResidents); } else toast(d.error||'ลบไม่สำเร็จ',true);
  });
}
function addResident(){
  const name=document.getElementById('newResName').value.trim();
  const entryYear=document.getElementById('newResYear').value;
  if(!name||!entryYear){ toast('กรอกชื่อและปีให้ครบ',true); return; }
  adminPost('adminSaveResident',{name:name,entryYear:entryYear,active:true}).then(d=>{
    if(d.ok){ toast('เพิ่มแล้ว ✓'); refreshData().then(renderResidents); } else toast(d.error||'เพิ่มไม่สำเร็จ',true);
  });
}

function renderFaculty(){
  const list=DATA.faculty||[];
  let rows=list.map(f=>`<tr data-row="${f.row}">
      <td><input value="${escAttr(f.name)}" class="f-name" style="width:180px"></td>
      <td><input value="${escAttr(f.nickname)}" class="f-nick" style="width:80px"></td>
      <td><input value="${escAttr(f.lineId)}" class="f-lineid" style="width:110px"></td>
      <td><input value="${escAttr(f.userId)}" class="f-userid mono" style="width:220px" placeholder="ยังไม่มี userId"></td>
      <td><label class="checkline"><input type="checkbox" ${f.active?'checked':''} class="f-active"> เปิดสิทธิ์</label></td>
      <td>
        <button class="btn small" onclick="saveFacultyRow(${f.row})">บันทึก</button>
        <button class="btn small danger" onclick="deleteFacultyRow(${f.row},'${escJs(f.name)}')">ลบ</button>
      </td>
    </tr>`).join('');

  document.getElementById('main').innerHTML=`
    <div class="pagehead"><h1>อาจารย์</h1><p>เพิ่ม/ลบอาจารย์ + userId สำหรับเปิดสิทธิ์ดูหน้าภาพรวม — วิธีหา userId: ให้อาจารย์เปิด <span class="mono">faculty-register.html</span> แล้วก๊อปมาใส่ที่นี่</p></div>
    <div class="card">
      <h2>รายชื่ออาจารย์ทั้งหมด (${list.length} คน)</h2>
      <table>
        <thead><tr><th>ชื่อ</th><th>ฉายา</th><th>LINE ID</th><th>User ID (สิทธิ์เข้าระบบ)</th><th>สถานะ</th><th></th></tr></thead>
        <tbody id="facTbody">${rows||'<tr><td colspan="6" class="mut">ยังไม่มีข้อมูล</td></tr>'}</tbody>
      </table>
      <p class="mut" style="margin-top:10px">ถ้าช่อง User ID ว่าง อาจารย์ท่านนั้นจะยังเข้าหน้า "ภาพรวม" ไม่ได้ — ต้องกรอกให้ครบก่อน</p>
    </div>
    <div class="card">
      <h2>เพิ่มอาจารย์ใหม่</h2>
      <div class="row-flex">
        <div class="field"><label>ชื่อ</label><input id="newFacName" placeholder="เช่น พญ.สมหญิง รักดี" style="width:200px"></div>
        <div class="field"><label>ฉายา</label><input id="newFacNick" placeholder="เช่น อ.หญิง" style="width:100px"></div>
        <div class="field"><label>LINE ID</label><input id="newFacLineId" placeholder="ชื่อผู้ใช้ LINE" style="width:140px"></div>
        <div class="field"><label>User ID (ถ้ามี)</label><input id="newFacUserId" placeholder="U... (ใส่ทีหลังได้)" style="width:220px"></div>
        <button class="btn" onclick="addFaculty()">+ เพิ่ม</button>
      </div>
    </div>
  `;
}
function saveFacultyRow(row){
  const tr=document.querySelector('#facTbody tr[data-row="'+row+'"]');
  const name=tr.querySelector('.f-name').value.trim();
  const nickname=tr.querySelector('.f-nick').value.trim();
  const lineId=tr.querySelector('.f-lineid').value.trim();
  const userId=tr.querySelector('.f-userid').value.trim();
  const active=tr.querySelector('.f-active').checked;

function addCritRow(btn){
  const block=btn.closest('.activity-block');
  const list=block.querySelector('.critList');
  const idx=list.children.length;
  const div=document.createElement('div');
  div.className='crit-row'; div.dataset.i=idx;
  div.innerHTML='<span class="idx">'+(idx+1)+'</span><input class="critInput" placeholder="ข้อคำถามใหม่"><button class="btn small danger" onclick="removeCritRow(this)">✕</button>';

function removeCritRow(btn){
  const block=btn.closest('.activity-block');

function addNewActivityBlock(){
  const name=document.getElementById('newActName').value.trim();
  if(!name){ toast('พิมพ์ชื่อกิจกรรมก่อนนะ',true); return; }
  const exists=[...document.querySelectorAll('.activity-block')].some(b=>b.dataset.act===name);
  if(exists){ toast('มีกิจกรรมนี้อยู่แล้ว',true); return; }
  const div=document.createElement('div');
  div.className='activity-block'; div.dataset.act=name;
  div.innerHTML='<div class="ahead"><b>'+name+'</b><span class="mut">1 ข้อ</span></div>'+
    '<div class="critList"><div class="crit-row" data-i="0"><span class="idx">1</span><input class="critInput" placeholder="ข้อคำถามแรก"><button class="btn small danger" onclick="removeCritRow(this)">✕</button></div></div>'+
    '<button class="btn ghost small" onclick="addCritRow(this)">+ เพิ่มข้อ</button>';
  document.getElementById('critBlocks').appendChild(div);
  document.getElementById('newActName').value='';
}
function saveAllCriteria(){
  const cap = DATA.critCapacity || 10;
  const blocks=[...document.querySelectorAll('.activity-block')];
  const out=[];
  let hasEmpty=false, over=null;
  blocks.forEach(b=>{
    const act=b.dataset.act;
    const inputs=[...b.querySelectorAll('.critInput')];
    if(inputs.length>cap) over=act;
    inputs.forEach((inp,i)=>{
      const val=inp.value.trim();
      if(!val) hasEmpty=true;
      out.push({activity:act, order:i+1, criterion:val});
    });
  });
  if(hasEmpty){ toast('มีข้อคำถามว่างอยู่ กรอกให้ครบก่อนบันทึก',true); return; }
  if(over){ toast('"'+over+'" มีข้อเกิน '+cap+' ข้อ — กดขยายคอลัมน์ด้านล่างก่อน',true); return; }
  adminPost('adminSaveCriteria',{criteria:out}).then(d=>{
    if(d.ok){ toast('บันทึกเกณฑ์ทั้งหมดแล้ว ✓'); refreshData().then(renderCriteria); } else toast(d.error||'บันทึกไม่สำเร็จ',true);
  });
}

    <div class="card">
      <h2>แพทย์ประจำบ้านที่ยังไม่เคยถูกประเมินเลย</h2>
      ${(s.neverEvaluated&&s.neverEvaluated.length)?`<p>${s.neverEvaluated.join(', ')}</p>`:'<p class="mut">ทุกคนเคยถูกประเมินแล้ว</p>'}
    </div>
  `;
}

function renderDanger(){
  document.getElementById('main').innerHTML=`
    <div class="pagehead"><h1>ล้างข้อมูลทดสอบ</h1><p>ใช้หลังทดลองระบบเสร็จแล้ว อยากเริ่มนับข้อมูลใหม่ — action นี้ลบถาวร กู้คืนไม่ได้</p></div>
    <div class="card">
      <h2>เลือกสิ่งที่จะล้าง</h2>
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
        <label class="checkline"><input type="checkbox" id="clearResponses"> <b>Responses</b> — ผลการประเมินกลุ่ม A ทั้งหมด</label>
        <label class="checkline"><input type="checkbox" id="clearMembers"> <b>Members</b> — การผูก LINE userId กับชื่อ (ทุกคนต้องเลือกชื่อใหม่ตอนเปิดแอปครั้งถัดไป)</label>
        <label class="checkline"><input type="checkbox" id="clearProgress"> <b>Progress</b> — ข้อมูล Progression tracker ทั้งหมด</label>
      </div>
      <button class="btn danger" onclick="doClearTestData()">ล้างข้อมูลที่เลือก</button>
      <p class="mut" style="margin-top:10px">แนะนำ: ทำสำเนาชีต (File → Make a copy) ไว้ก่อนกดล้าง เผื่ออยากดูข้อมูลทดสอบย้อนหลัง</p>
    </div>
  `;
}
function doClearTestData(){
  const targets=[];
  if(document.getElementById('clearResponses').checked) targets.push('responses');
  if(document.getElementById('clearMembers').checked) targets.push('members');
  if(document.getElementById('clearProgress').checked) targets.push('progress');
  if(!targets.length){ toast('เลือกอย่างน้อย 1 อย่างก่อนนะ',true); return; }
  if(!confirm('ยืนยันล้างข้อมูล: '+targets.join(', ')+'\n\nการกระทำนี้ย้อนกลับไม่ได้')) return;
  adminPost('adminClearTestData',{targets:targets}).then(d=>{
    if(d.ok){ toast('ล้างข้อมูลแล้ว ✓ ('+d.cleared.join(', ')+')'); refreshData(); }
    else toast(d.error||'ล้างไม่สำเร็จ',true);
  });
}

function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
/** สำหรับค่าที่ถูกวางลงใน "สตริง JS" ภายใน onclick — ต้อง escape \ และ ' ด้วย
 *  (escAttr อย่างเดียวไม่พอ เพราะ ' ไม่ใช่อักขระพิเศษของ HTML แต่เป็นตัวปิดสตริงของ JS) */
function escJs(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
</script>
